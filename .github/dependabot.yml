version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/packages/python"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/packages/python"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/documentation"
    schedule:
      interval: "weekly"
