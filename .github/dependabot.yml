version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Keep these versions aligned with LazyMatrix's nalgebra_v0_34 adapters.
    ignore:
      - dependency-name: "nalgebra"
        versions: [">=0.35.0"]
      - dependency-name: "nalgebra-sparse"
        versions: [">=0.12.0"]
  - package-ecosystem: "cargo"
    directory: "/packages/python"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/packages/python"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
