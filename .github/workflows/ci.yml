name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build without backends
        run: cargo build --locked --no-default-features

      - name: Test
        run: |
          cargo test --locked --no-default-features
          cargo test --locked --no-default-features --features faer_v0_24
          cargo test --locked --no-default-features --features nalgebra_v0_34
          cargo test --locked --no-default-features --features ndarray_v0_17
          cargo test --locked --no-default-features --features sprs_v0_11
          cargo test --locked --no-default-features --features faer
          cargo test --locked --no-default-features --features nalgebra
          cargo test --locked --no-default-features --features ndarray
          cargo test --locked --no-default-features --features sprs
          cargo test --locked --no-default-features --features zarrs_v0_22
          cargo test --locked --no-default-features --features zarrs
          cargo test --locked --no-default-features --features experimental-block-reader,zarrs_v0_22
          cargo test --locked --all-features

      - name: Verify matrix integration and fitting
        run: |
          cargo run --locked --example normalization --features faer_v0_24
          cargo run --locked --example lasso --features faer_v0_24
          cargo run --locked --example multivariate --features faer_v0_24
          cargo run --locked --example zarrs_buffered --features experimental-block-reader,zarrs_v0_22

      - name: Check fitting heap budgets
        run: cargo bench --locked --no-default-features --features faer_v0_24 --bench lasso_heap

      - name: Check documentation
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - uses: jolars/panache-action@v1
        with:
          version: v3.8.0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: documentation/package-lock.json

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Check independent releases
        run: |
          npm --prefix documentation ci --ignore-scripts
          npm --prefix documentation run check:releases

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/python
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install Python package
        run: uv sync --locked --project packages/python
      - name: Test Python package
        run: uv run --locked --project packages/python pytest packages/python/tests
      - name: Check Python and native source
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          cargo fmt --manifest-path packages/python/Cargo.toml -- --check
          cargo clippy --locked --manifest-path packages/python/Cargo.toml --all-targets -- -D warnings
          uv run --locked --project packages/python ruff format --check packages/python scripts
          uv run --locked --project packages/python ruff check packages/python scripts
          uv run --locked --project packages/python mypy --config-file packages/python/pyproject.toml packages/python/src/shrinkage packages/python/tests scripts/check_python_artifacts.py
      - name: Test built wheel
        run: uv run --locked --project packages/python python scripts/check_python_artifacts.py
      - name: Rebuild and test the source distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: uv run --locked --project packages/python python scripts/check_python_artifacts.py --sdist

  versionary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install Rust
        run: rustup toolchain install

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - id: versionary
        uses: jolars/versionary@v1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          versionary-version: 1.6.0
