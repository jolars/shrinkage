name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: MSRV (Rust 1.84, Python Rust 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install minimum Rust toolchains
        run: rustup toolchain install 1.84.0 1.85.0 --profile minimal

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.11"

      # PyO3 caches library paths that include the Python patch version.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            packages/python
          key: msrv-python-${{ steps.python.outputs.python-version }}

      - name: Build without backends
        run: cargo +1.84.0 build --locked --lib --no-default-features

      - name: Build compatible features and aliases
        run: |
          for features in faer_v0_24 faer ndarray_v0_17 ndarray experimental-block-reader faer_v0_24,ndarray_v0_17,experimental-block-reader; do
            cargo +1.84.0 build --locked --lib --no-default-features --features "$features"
          done

      - name: Build Python bindings
        run: cargo +1.85.0 build --locked --lib --manifest-path packages/python/Cargo.toml
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build without backends
        run: cargo build --locked --no-default-features

      - name: Test
        run: |
          cargo test --locked --no-default-features
          cargo test --locked --no-default-features --features faer_v0_24
          cargo test --locked --no-default-features --features nalgebra_v0_34
          cargo test --locked --no-default-features --features ndarray_v0_17
          cargo test --locked --no-default-features --features sprs_v0_11
          cargo test --locked --no-default-features --features faer
          cargo test --locked --no-default-features --features nalgebra
          cargo test --locked --no-default-features --features ndarray
          cargo test --locked --no-default-features --features sprs
          cargo test --locked --no-default-features --features zarrs_v0_22
          cargo test --locked --no-default-features --features zarrs
          cargo test --locked --no-default-features --features experimental-block-reader,zarrs_v0_22
          cargo test --locked --all-features

      - name: Verify matrix integration and fitting
        run: |
          cargo run --locked --example normalization --features faer_v0_24
          cargo run --locked --example lasso --features faer_v0_24
          cargo run --locked --example multivariate --features faer_v0_24
          cargo run --locked --example python_lasso_fixture --features ndarray_v0_17 -- --check
          cargo run --locked --example python_model_fixture --features ndarray_v0_17 -- --check
          cargo run --locked --example python_path_fixture --features ndarray_v0_17 -- --check
          cargo run --locked --example zarrs_buffered --features experimental-block-reader,zarrs_v0_22

      - name: Check fitting heap budgets
        run: cargo bench --locked --no-default-features --features faer_v0_24 --bench lasso_heap

      - name: Check documentation
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - uses: jolars/panache-action@v1
        with:
          version: v3.8.0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check independent releases
        run: |
          npm --prefix docs ci --ignore-scripts
          npm --prefix docs run check:releases

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/python
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install Python package
        run: uv sync --locked --project packages/python
      - name: Test Python package
        run: uv run --locked --project packages/python pytest packages/python/tests
      - name: Check Python and native source
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          cargo fmt --manifest-path packages/python/Cargo.toml -- --check
          cargo clippy --locked --manifest-path packages/python/Cargo.toml --all-targets -- -D warnings
          uv run --locked --project packages/python ruff format --check packages/python scripts
          uv run --locked --project packages/python ruff check packages/python scripts
          uv run --locked --project packages/python mypy --config-file packages/python/pyproject.toml packages/python/src/shrinkage packages/python/tests scripts/check_python_artifacts.py
      - name: Test built wheel
        run: uv run --locked --project packages/python python scripts/check_python_artifacts.py
      - name: Rebuild and test the source distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: uv run --locked --project packages/python python scripts/check_python_artifacts.py --sdist

  r:
    name: R ${{ matrix.config.r }} (${{ matrix.config.os }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macos-latest, r: release }
          - { os: windows-latest, r: release }
          - { os: ubuntu-latest, r: devel, http-user-agent: release }
          - { os: ubuntu-latest, r: release }
          - { os: ubuntu-latest, r: oldrel-1 }
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: "yes"
      _R_CHECK_COMPILED_CODE_USE_OBJECTS_SYMBOL_TABLES_: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: packages/r
          extra-packages: any::rcmdcheck
          needs: check
      - name: Install Rust
        run: rustup toolchain install
      - name: Install Windows GNU Rust target
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu
      - name: Check native binding
        if: runner.os == 'Linux' && matrix.config.r == 'release'
        run: |
          cargo fmt --manifest-path packages/r/src/rust/Cargo.toml -- --check
          cargo clippy --locked --manifest-path packages/r/src/rust/Cargo.toml --all-targets -- -D warnings
          R CMD cargo run --locked --manifest-path packages/r/src/rust/Cargo.toml --bin document
          git diff --exit-code -- packages/r/R/extendr-wrappers.R
      - name: Stage R source package
        run: Rscript packages/r/tools/package.R stage
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: .build/r/shrinkage
          args: '"--no-manual"'
      - name: Build downloadable source archive
        if: runner.os == 'Linux' && matrix.config.r == 'release'
        run: Rscript packages/r/tools/package.R build
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux' && matrix.config.r == 'release'
        with:
          name: shrinkage-r-source
          path: dist/shrinkage_*.tar.gz
          if-no-files-found: error

  versionary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [msrv, check, python, r]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install Rust
        run: rustup toolchain install

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - id: versionary
        uses: jolars/versionary@v1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          versionary-version: 1.6.0
