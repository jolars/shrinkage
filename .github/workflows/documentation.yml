name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Diplodocus
        uses: jolars/setup-diplodocus@c24f7f8cac71f80beab04350ac6b98062612345c # v1.0.0
        with:
          version: "0.6.0"
      - name: Install Rust toolchains
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup toolchain install nightly-2026-09-28 --profile minimal
          echo "DIPLODOCUS_RUST_TOOLCHAIN=$(dirname "$(dirname "$(rustup which --toolchain nightly-2026-09-28 rustc)")")" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            packages/python
          key: documentation
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Configure the Python environment
        # Keep generated environment symlinks outside the Rust input inventory.
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/shrinkage-docs-venv" >> "$GITHUB_ENV"
      - name: Prepare package dependencies
        run: |
          uv sync --locked --project packages/python
          cargo fetch --locked
      - name: Check documentation
        run: uv run --no-sync --project packages/python diplodocus check --config docs/diplodocus.yaml
      - name: Build documentation
        run: uv run --no-sync --project packages/python diplodocus build --config docs/diplodocus.yaml --output docs/site
      - name: Install public assets and shared head markup
        run: python scripts/prepare_documentation.py
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install deployment dependencies
        run: npm --prefix docs ci --ignore-scripts
      - name: Check Worker package
        run: npm --prefix docs run check
      - uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs/site
      - name: Deploy documentation
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm --prefix docs run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
