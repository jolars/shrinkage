name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchains
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup toolchain install nightly-2026-09-28 --profile minimal
          echo "DIPLODOCUS_RUST_TOOLCHAIN=$(dirname "$(dirname "$(rustup which --toolchain nightly-2026-09-28 rustc)")")" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            packages/python
          key: documentation
      - name: Install patched Diplodocus
        run: |
          revision=$(python -c 'from pathlib import Path; import re; print(re.search(r"github:jolars/diplodocus/([0-9a-f]{40})", Path("devenv.yaml").read_text())[1])')
          source="$RUNNER_TEMP/diplodocus-source"
          mkdir -p "$source"
          curl --fail --location --retry 3 "https://github.com/jolars/diplodocus/archive/$revision.tar.gz" | tar -xz --strip-components=1 -C "$source"
          patch -d "$source" -p1 < docs/diplodocus-generated-inputs.patch
          patch -d "$source" -p1 < docs/diplodocus-math.patch
          cargo +nightly-2026-09-28 install --locked --path "$source" --root "$RUNNER_TEMP/diplodocus"
          echo "$RUNNER_TEMP/diplodocus/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Configure the Python environment
        # Keep generated environment symlinks outside the Rust input inventory.
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/shrinkage-docs-venv" >> "$GITHUB_ENV"
      - name: Prepare package dependencies
        run: |
          cp CONTRIBUTING.md docs/pages/contribution.md
          uv sync --locked --project packages/python
          cargo fetch --locked
      - name: Check documentation
        run: uv run --no-sync --project packages/python diplodocus check --config docs/diplodocus.yaml
      - name: Check penalty figures
        run: uv run --script scripts/penalty_regions.py --check
      - name: Build documentation
        run: uv run --no-sync --project packages/python diplodocus build --config docs/diplodocus.yaml --output docs/site
      - name: Install public assets and shared head markup
        run: python scripts/prepare_documentation.py
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install deployment dependencies
        run: npm --prefix docs ci --ignore-scripts
      - name: Check Worker package
        run: npm --prefix docs run check
      - uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs/site
      - name: Deploy documentation
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm --prefix docs run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
