[package]
name = "shrinkage"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Composable regularized statistical models in Rust."
authors = ["Johan Larsson <johan@jolars.co>"]
license = "MIT"
repository = "https://github.com/jolars/shrinkage"
readme = "README.md"
keywords = ["statistics", "optimization", "regression", "regularization"]
categories = ["mathematics", "science"]

[dependencies]
lazymatrix = { version = "=0.3.0", default-features = false }
faer = { version = "0.24", optional = true, default-features = false, features = [
  "std",
  "linalg",
] }

[features]
default = []
faer = ["dep:faer", "lazymatrix/faer_v0_24"]
nalgebra = ["lazymatrix/nalgebra_v0_34"]
ndarray = ["lazymatrix/ndarray_v0_17"]
sprs = ["lazymatrix/sprs_v0_11"]

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
nalgebra-sparse = "0.11"
ndarray = { version = "0.17.2", default-features = false, features = ["std"] }
sprs = { version = "0.11.4", default-features = false }

[[example]]
name = "normalization"
required-features = ["faer"]

[[example]]
name = "lasso"
required-features = ["faer"]

[[bench]]
name = "lasso"
harness = false
required-features = ["faer"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
