[package]
name = "shrinkage"
version = "0.4.0"
edition = "2021"
rust-version = "1.84"
resolver = "3"
description = "Composable regularized statistical models in Rust."
authors = ["Johan Larsson <johan@jolars.co>"]
license = "MIT"
repository = "https://github.com/jolars/shrinkage"
readme = "README.md"
documentation = "https://shrinkage.cc/packages/rust/"
exclude = ["packages/**", "docs/**", "scripts/**"]
keywords = ["statistics", "optimization", "regression", "regularization"]
categories = ["mathematics", "science"]

[dependencies]
lazymatrix = { version = "0.9.0", default-features = false }
faer = { version = "0.24", optional = true, default-features = false, features = [
  "std",
  "linalg",
] }
nalgebra = { version = "0.34", optional = true, default-features = false, features = ["std"] }
ndarray = { version = "0.17.2", optional = true, default-features = false, features = ["std"] }
nalgebra-sparse = { version = "0.11", optional = true }
sprs = { version = "0.11.4", optional = true, default-features = false }
zarrs = { version = "0.22.10", optional = true, default-features = false, features = ["filesystem", "gzip"] }

[features]
default = []
experimental-block-reader = []
zarrs = ["zarrs_v0_22"]
zarrs_v0_22 = ["dep:zarrs", "lazymatrix/zarrs_v0_22"]
faer = ["faer_v0_24"]
faer_v0_24 = ["dep:faer", "lazymatrix/faer_v0_24"]
nalgebra = ["nalgebra_v0_34"]
nalgebra_v0_34 = ["dep:nalgebra", "dep:nalgebra-sparse", "lazymatrix/nalgebra_v0_34"]
ndarray = ["ndarray_v0_17"]
ndarray_v0_17 = ["dep:ndarray", "lazymatrix/ndarray_v0_17"]
sprs = ["sprs_v0_11"]
sprs_v0_11 = ["dep:sprs", "lazymatrix/sprs_v0_11"]

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8.2", default-features = false }
dhat = "0.3.3"
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
nalgebra-sparse = "0.11"
ndarray = { version = "0.17.2", default-features = false, features = ["std"] }
sprs = { version = "0.11.4", default-features = false }
serde_json = "1"

