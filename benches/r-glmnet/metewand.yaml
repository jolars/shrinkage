version: 1
name: r-gaussian-lasso
default-experiment: smoke
environments:
  single-thread:
    kind: local
    environment-variables:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
datasets:
  dense: &dataset
    runner: r
    protocol-transport: socket
    entrypoint: worker.R
    sources: &sources [worker.R, library, build.json]
    environment: single-thread
    args: [dataset]
    output-schema: &dataset-schema
      type: object
      required: [schema_version, complete, files]
      properties:
        schema_version: {const: 1}
        complete: {const: true}
        files: {type: array, minItems: 1}
    parameters:
      n_samples: {type: integer, minimum: 2, default: 1024}
      n_features: {type: integer, minimum: 2, default: 512}
      data_seed: {type: integer, minimum: 0, default: 17}
      density: {type: number, exclusiveMinimum: 0, maximum: 1, default: 1}
      lambda_fraction: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1, default: 0.1}
  sparse:
    <<: *dataset
    parameter-defaults: {n_samples: 512, n_features: 2048, density: 0.1}
problems:
  lasso:
    dataset-schemas: [*dataset-schema]
    result:
      beta: {type: array, items: number}
    metrics:
      objective: {type: number, optional: true}
      duality_gap: {type: number, optional: true}
      relative_gap: {type: number, optional: true}
      kkt_violation: {type: number, optional: true}
      lambda: {type: number, optional: true}
    allowed-timing-scopes: [execute_only]
    semantics:
      objective: "||y - X beta||^2 / (2 n) + lambda ||beta||_1"
      validity: {beta: finite_vector_matching_feature_count}
      one_shot_completion: {relative_gap: 1.0e-8}
    reference-cases:
      - dataset: {x: [[1, 0], [0, 1]], y: [2, -1], lambda: 0.25}
        result: {beta: [1.5, -0.5]}
        expected-metrics: {objective: 0.625, duality_gap: 0, relative_gap: 0, kkt_violation: 0, lambda: 0.25}
      - dataset: {x: [[1, 0], [0, 1]], y: [2, -1], lambda: 0.25}
        result: {beta: [0, 0]}
        expected-metrics: {objective: 1.25, duality_gap: 0.703125, relative_gap: 0.5625, kkt_violation: 0.75, lambda: 0.25}
        expected-verdict: not_reached
      - dataset: {x: [[1, 0], [0, 1]], y: [2, -1], lambda: 0.25}
        result: {beta: [0]}
        expected-metrics: {}
        expected-verdict: invalid
    evaluator:
      runner: r
      protocol-transport: socket
      entrypoint: worker.R
      sources: *sources
      environment: single-thread
      args: [evaluate]
implementations:
  shrinkage: &implementation
    runner: r
    protocol-transport: socket
    entrypoint: worker.R
    sources: *sources
    environment: single-thread
    args: [shrinkage]
    problem-contracts: [lasso]
    capabilities: [one_shot, fresh_sequence]
  glmnet:
    <<: *implementation
    args: [glmnet]
experiments:
  - &comparison
    name: smoke
    problem: lasso
    datasets: [dense, sparse]
    dataset-parameters:
      dense: {n_samples: 192, n_features: 128}
      sparse: {n_samples: 192, n_features: 256}
    implementations: [shrinkage, glmnet]
    execution-policy: serial
    observation-policy: fit
    measurement-repetitions: 1
    seed: 17
  - <<: *comparison
    name: compare
    dataset-parameters: {}
    measurement-repetitions: 5
  - <<: *comparison
    name: vignette
    datasets: [dense]
    dataset-parameters:
      dense: {n_samples: 4096, n_features: 1536}
    observation-policy: convergence
    measurement-repetitions: 5
execution-policies:
  serial:
    timing-scope: execute_only
    primary-time: timed_wall_time
    max-concurrency: 1
    run-order: randomized
    worker-reuse: true
    warmup-runs: 1
observation-policies:
  fit:
    kind: one_shot
  convergence:
    kind: profile
    metric: relative_gap
    direction: at_most
    threshold: 1.0e-8
    max-active-time: 30 s
    max-observations: 17
    implementations:
      shrinkage:
        delivery: fresh_sequence
        control-schema:
          type: object
          properties: {sweeps: {type: integer, minimum: 1}}
          required: [sweeps]
        schedule:
          kind: explicit
          controls: [{sweeps: 1}, {sweeps: 2}, {sweeps: 4}, {sweeps: 8}, {sweeps: 12}, {sweeps: 16}, {sweeps: 24}, {sweeps: 32}, {sweeps: 48}, {sweeps: 64}, {sweeps: 96}, {sweeps: 128}, {sweeps: 256}, {sweeps: 512}, {sweeps: 1024}, {sweeps: 10000}]
      glmnet:
        delivery: fresh_sequence
        control-schema:
          type: object
          properties: {threshold: {type: number, exclusiveMinimum: 0}}
          required: [threshold]
        schedule: {kind: geometric, field: threshold, start: 0.01, ratio: 0.1, count: 17}
