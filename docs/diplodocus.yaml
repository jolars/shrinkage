project:
  name: "Shrinkage"

presentation:
  sections:
    - label: "Reference"
      path: "reference/index.html"
  site-url: "https://shrinkage.cc/"
  canonical-url-style: "clean"
  description: "Regularized statistical models in Rust and Python."
  home:
    tagline: "Big models. Small coefficients."
    description: "Fit regularized statistical models with a Rust numerical core. Start with lasso, explore regularization paths, or compose a model from losses, penalties, and solvers."
    guide: "installation.html"
    actions:
      - label: "Get started"
        path: "installation.html"
        icon: "book-open"
      - label: "Rust API"
        path: "packages/rust/index.html"
        icon: "code"
      - label: "Python API"
        path: "packages/python/index.html"
        icon: "terminal"
    features:
      - title: "Models from reusable parts"
        description: "Combine Gaussian, binomial, and multivariate Gaussian losses with compatible penalties and solvers. Extend the Rust API with your own components."
        path: "packages/rust/index.html"
      - title: "Dense and sparse matrices"
        description: "Use faer, nalgebra, ndarray, or sparse CSC matrices. Enable the integrations you need through optional Rust features."
        path: "installation.html"
      - title: "Lasso from Python"
        description: "Fit dense Gaussian lasso from NumPy arrays, predict on new observations, and inspect convergence diagnostics."
        path: "packages/python/index.html"
  logo:
    repository: "shrinkage"
    path: "assets/logo-large.png"
  footer:
    docs-version: "dev"
    copyright: "© 2026 Johan Larsson"
    licenses:
      - label: "MIT"
        url: "https://github.com/jolars/shrinkage/blob/main/LICENSE"
    links:
      - label: "GitHub"
        url: "https://github.com/jolars/shrinkage"
      - label: "Report an issue"
        url: "https://github.com/jolars/shrinkage/issues"
    built-with: true

repositories:
  - id: "shrinkage"
    path: ".."
    url: "https://github.com/jolars/shrinkage"

components:
  - id: "optimization-explorer"
    repository: "shrinkage"
    path: "docs/widget/dist"
    module: "index.js"
    stylesheets: ["style.css"]

packages:
  - id: "rust"
    name: "Shrinkage for Rust"
    slug: "rust"
    ecosystem: "rust"
    repository: "shrinkage"
    path: "."
    metadata-path: "Cargo.toml"
    overview: "docs/rust-overview.md"
    targets:
      - id: "api"
        extractor: "rust"
        path: "src/lib.rs"
        role: "public-api"
        rust:
          default-features: false
          features:
            - "faer_v0_24"
            - "nalgebra_v0_34"
            - "ndarray_v0_17"
            - "sprs_v0_11"
            - "zarrs_v0_22"
            - "experimental-block-reader"
  - id: "python"
    name: "Shrinkage for Python"
    slug: "python"
    ecosystem: "python"
    repository: "shrinkage"
    path: "packages/python"
    metadata-path: "pyproject.toml"
    targets:
      - id: "api"
        extractor: "python"
        path: "src/shrinkage"
        role: "public-api"

content:
  - id: "guide"
    owner: "project"
    repository: "shrinkage"
    path: "docs/pages"
    mount: ""
    format: "gfm"
    execution:
      mode: "never"
