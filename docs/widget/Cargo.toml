[package]
name = "shrinkage-widget"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shrinkage = { path = "../..", default-features = false, features = ["nalgebra_v0_34"] }
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
serde-wasm-bindgen = "0.6"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
