[package]
name = "shrinkage-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Python bindings for Shrinkage regularized statistical models."
authors = ["Johan Larsson <johan@jolars.co>"]
license = "MIT"
repository = "https://github.com/jolars/shrinkage"
publish = false

[lib]
name = "_shrinkage"
path = "rust/lib.rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.30.1"
shrinkage = { path = "../..", default-features = false }

[workspace]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
