[package]
name = "shrinkage-python"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Python bindings for Shrinkage regularized statistical models."
authors = [ "Johan Larsson <johan@jolars.co>" ]
license = "MIT"
repository = "https://github.com/jolars/shrinkage"
publish = false

[lib]
name = "_shrinkage"
path = "rust/lib.rs"
crate-type = [ "cdylib" ]

[dependencies]
pyo3 = "0.30.1"

[dependencies.ndarray]
version = "0.17.2"
default-features = false
features = [ "std" ]

[dependencies.shrinkage]
path = "../.."
default-features = false
features = [ "ndarray_v0_17" ]

[workspace]
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

