[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "shrinkage"
version = "0.2.0"
description = "Regularized statistical models backed by Rust."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]
license = "MIT"
authors = [{ name = "Johan Larsson", email = "johan@jolars.co" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://shrinkage.cc/packages/python/"
Repository = "https://github.com/jolars/shrinkage"
Issues = "https://github.com/jolars/shrinkage/issues"

[dependency-groups]
dev = ["maturin>=1.15,<2", "mypy>=1.14", "pytest>=8.3", "ruff>=0.16"]
benchmark = [
    "matplotlib>=3.10",
    "metewand",
    "scikit-learn>=1.7",
]

[tool.uv.sources]
# Metewand's Python package is not published to PyPI yet.
metewand = { git = "https://github.com/jolars/metewand", rev = "98db3e92fc8087a0ea14b7768e4160fb53bd4f04", subdirectory = "packages/python" }

[tool.maturin]
module-name = "shrinkage._shrinkage"
python-source = "src"
locked = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
strict = true
files = ["src/shrinkage", "tests", "../../scripts/check_python_artifacts.py"]
